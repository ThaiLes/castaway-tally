<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castaway Admin Portal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f172a; color: #fff; padding: 16px; max-width: 680px; margin: 0 auto; }
  .header { border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .status { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #065f46; color: #34d399; font-weight: bold; }
  .status.bad { background: #7f1d1d; color: #fca5a5; }
  .heart-icon { display: inline-block; margin-left: 6px; font-size: 16px; }
  .heart-icon.pulse { animation: heartPulse 1.2s infinite ease-in-out; }
  @keyframes heartPulse { 0%{transform:scale(1)} 15%{transform:scale(1.25)} 30%{transform:scale(1)} 45%{transform:scale(1.15)} 60%{transform:scale(1)} 100%{transform:scale(1)} }
  .nav-grid, .filter-grid, .pay-grid { display: grid; gap: 6px; margin-bottom: 14px; }
  .nav-grid { grid-template-columns: repeat(4, 1fr); }
  .filter-grid { grid-template-columns: repeat(4, 1fr); }
  .pay-grid { grid-template-columns: repeat(3, 1fr); }
  .nav-btn, .filter-btn, .pay-btn { padding: 8px 4px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-weight: bold; font-size: 10px; cursor: pointer; }
  .nav-btn.active, .pay-btn.active { background: #06b6d4; color: #0f172a; border-color: #06b6d4; }
  .filter-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .kpi-card { background: #1e293b; padding: 12px 8px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
  .kpi-val { font-size: 16px; font-weight: bold; color: #06b6d4; margin-top: 4px; }
  .kpi-lbl { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
  .note { font-size: 11px; color: #94a3b8; margin: 6px 0 12px; }
  .table-container, .chart-card, .item-row, .calendar-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; }
  .table-container { overflow: hidden; margin-top: 10px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table th { background: #0f172a; color: #94a3b8; padding: 10px 8px; text-transform: uppercase; font-size: 10px; text-align: left; }
  .data-table td { padding: 10px 8px; border-bottom: 1px solid #0f172a; }
  .tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
  .tag-food { color: #f59e0b; background: #f59e0b22; }
  .tag-soft { color: #38bdf8; background: #38bdf822; }
  .tag-alc { color: #f472b6; background: #f472b622; }
  .tag-uns { color: #fca5a5; background: #7f1d1d; }
  .item-row { display: flex; justify-content: space-between; gap: 8px; padding: 12px; margin-bottom: 8px; }
  .chart-card { padding: 16px; margin-bottom: 16px; }
  .chart-card h3 { font-size: 13px; margin-bottom: 10px; text-transform: uppercase; }
  .bar-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 11px; }
  .bar-label { width: 52px; color: #94a3b8; }
  .bar-track { flex: 1; background: #0f172a; height: 16px; border-radius: 4px; overflow: hidden; margin: 0 8px; }
  .bar-fill { height: 100%; }
  .food { background: #f59e0b; } .soft { background: #38bdf8; } .alc { background: #f472b6; }
  .section-title { font-size: 12px; font-weight: bold; margin: 14px 0 8px; text-transform: uppercase; }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-btn, .btn-action { background: #0f172a; border: 1px solid #334155; color: #38bdf8; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  .btn-action { width: 100%; background: #06b6d4; color: #0f172a; border: none; margin-top: 14px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-day { font-size: 12px; padding: 8px 0; border-radius: 6px; background: #0f172a; cursor: pointer; }
  .cal-day.empty { background: transparent; }
  .cal-day.selected { background: #06b6d4; color: #0f172a; font-weight: bold; }
  .cal-day.in-range { background: #06b6d444; color: #38bdf8; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h2 style="margin:0; font-size:18px;">Castaway Admin <span id="heart-status" class="heart-icon"></span></h2>
    <span style="font-size:11px; color:#94a3b8;">Bills and charges, both counted</span>
  </div>
  <span id="status" class="status">Syncing...</span>
</div>
<div class="nav-grid">
  <button class="nav-btn active" id="btn-tab-dashboard" onclick="switchTab('dashboard')">Dashboard</button>
  <button class="nav-btn" id="btn-tab-performance" onclick="switchTab('performance')">Performance</button>
  <button class="nav-btn" id="btn-tab-analytics" onclick="switchTab('analytics')">Analytics</button>
  <button class="nav-btn" id="btn-tab-lookup" onclick="switchTab('lookup')">Date Lookup</button>
</div>

<div id="tab-dashboard" class="tab-content active">
  <div class="pay-grid">
    <button class="pay-btn active" id="pay-all" onclick="setPay('all')">ALL</button>
    <button class="pay-btn" id="pay-cash" onclick="setPay('cash')">BILL</button>
    <button class="pay-btn" id="pay-pos" onclick="setPay('pos')">CHARGE</button>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-lbl">Sales</div><div id="kpi-rev" class="kpi-val">฿0</div></div>
    <div class="kpi-card"><div class="kpi-lbl">BILL</div><div id="kpi-cash" class="kpi-val">฿0</div></div>
    <div class="kpi-card"><div class="kpi-lbl">CHARGE</div><div id="kpi-pos" class="kpi-val">฿0</div></div>
  </div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-lbl">Food</div><div id="kpi-food" class="kpi-val" style="color:#f59e0b;">฿0</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Soft drinks</div><div id="kpi-soft" class="kpi-val" style="color:#38bdf8;">฿0</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Alcohol</div><div id="kpi-alc" class="kpi-val" style="color:#f472b6;">฿0</div></div>
  </div>
  <p class="note" id="dash-note"></p>
  <h3 style="font-size:14px; color:#94a3b8;">Item count</h3>
  <div class="table-container"><table class="data-table"><thead><tr><th>Item</th><th>Qty</th><th>Group</th><th style="text-align:right;">Baht</th></tr></thead><tbody id="today-table-body"></tbody></table></div>
</div>

<div id="tab-performance" class="tab-content">
  <div class="filter-grid">
    <button class="filter-btn active" id="flt-today" onclick="setRange('today')">Today</button>
    <button class="filter-btn" id="flt-week" onclick="setRange('week')">7 days</button>
    <button class="filter-btn" id="flt-month" onclick="setRange('month')">30 days</button>
    <button class="filter-btn" id="flt-all" onclick="setRange('all')">All</button>
  </div>
  <div id="performance-list"></div>
</div>

<div id="tab-analytics" class="tab-content">
  <p class="note" id="peak-line">Peak hours load with the selected range.</p>
  <div class="chart-card"><h3 style="color:#f59e0b;">Food units</h3><div id="chart-food"></div></div>
  <div class="chart-card"><h3 style="color:#38bdf8;">Soft drink units</h3><div id="chart-soft"></div></div>
  <div class="chart-card"><h3 style="color:#f472b6;">Alcohol units</h3><div id="chart-alc"></div></div>
  <div id="best-lists"></div>
</div>

<div id="tab-lookup" class="tab-content">
  <div class="calendar-card" style="padding:16px;">
    <div class="cal-header">
      <button class="cal-btn" onclick="changeMonth(-1)"><</button>
      <div id="cal-month-title"></div>
      <button class="cal-btn" onclick="changeMonth(1)">></button>
    </div>
    <div class="cal-grid"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
    <div id="cal-days-grid" class="cal-grid" style="margin-top:4px;"></div>
    <p class="note" id="cal-selection-label" style="text-align:center;">Click a day, or two days for a range.</p>
    <button class="btn-action" onclick="fetchCalendar()">Inspect selected days</button>
  </div>
  <div id="lookup-results" style="margin-top:16px;"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxSySBORWg8hOuiboEEHDY_EaryuyEwuDBerK8_iqeJnE7u67xcTYWguhFqXDMx5jOe/exec";
let adminData = { items: [], hourly: {} };
let lookupData = null;
let currentRange = "today";
let payMode = "all";
let activeTab = "dashboard";
let calDate = new Date();
let rangeStart = null, rangeEnd = null;

function baht(n) { return "฿" + (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 0 }); }
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&")
    .replace(/</g, "<")
    .replace(/>/g, ">")
    .replace(/"/g, """)
    .replace(/'/g, "&#39;");
}
function unitsOf(p) { return payMode === "cash" ? p.cashUnits : payMode === "pos" ? p.posUnits : p.cashUnits + p.posUnits; }
function moneyOf(p) { return payMode === "cash" ? p.cashRevenue : payMode === "pos" ? p.posRevenue : p.cashRevenue + p.posRevenue; }
function tag(cat) { return cat === "Food" ? "tag-food" : cat === "Soft drinks" ? "tag-soft" : cat === "Alcohol" ? "tag-alc" : "tag-uns"; }

function switchTab(name) {
  activeTab = name;
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  document.getElementById("btn-tab-" + name).classList.add("active");
  if (name === "lookup") renderCalendar();
}
function setPay(mode) {
  payMode = mode;
  document.querySelectorAll(".pay-btn").forEach(el => el.classList.remove("active"));
  document.getElementById("pay-" + mode).classList.add("active");
  renderAll();
}
function setRange(range) {
  currentRange = range;
  document.querySelectorAll(".filter-btn").forEach(el => el.classList.remove("active"));
  document.getElementById("flt-" + range).classList.add("active");
  fetchAdminData(range);
}
function fetchAdminData(range, startDate, endDate) {
  document.getElementById("status").textContent = "Syncing...";
  document.getElementById("status").classList.remove("bad");
  var old = document.getElementById("jsonp-fetch-script");
  if (old) old.remove();
  var script = document.createElement("script");
  script.id = "jsonp-fetch-script";
  script.src = API_URL + "?action=getAdminData&range=" + encodeURIComponent(range)
    + "&startDate=" + encodeURIComponent(startDate || "") + "&endDate=" + encodeURIComponent(endDate || "")
    + "&callback=handleAdminData&t=" + Date.now();
  script.onerror = function () {
    document.getElementById("status").textContent = "Error";
    document.getElementById("status").classList.add("bad");
  };
  document.body.appendChild(script);
}
window.handleAdminData = function (data) {
  if (!data || data.status !== "success") return;
  document.getElementById("status").textContent = "Live";
  var heart = document.getElementById("heart-status");
  heart.textContent = data.isOnline ? "♥" : "♡";
  heart.classList.toggle("pulse", !!data.isOnline);
  if (data.range === "custom") { lookupData = data; renderLookup(); return; }
  adminData = data;
  renderAll();
};
function renderAll() { renderDashboard(); renderPerformance(); renderAnalytics(); }

function renderDashboard() {
  var items = adminData.items || [];
  var food = 0, soft = 0, alc = 0, cash = 0, pos = 0;
  items.forEach(function (p) {
    cash += p.cashRevenue; pos += p.posRevenue;
    var m = moneyOf(p);
    if (p.category === "Food") food += m;
    else if (p.category === "Soft drinks") soft += m;
    else if (p.category === "Alcohol") alc += m;
  });
  document.getElementById("kpi-rev").textContent = baht(payMode === "cash" ? cash : payMode === "pos" ? pos : cash + pos);
  document.getElementById("kpi-cash").textContent = baht(cash);
  document.getElementById("kpi-pos").textContent = baht(pos);
  document.getElementById("kpi-food").textContent = baht(food);
  document.getElementById("kpi-soft").textContent = baht(soft);
  document.getElementById("kpi-alc").textContent = baht(alc);
  var uns = (adminData.unsorted || []).length;
  document.getElementById("dash-note").textContent = uns ? uns + " item names did not match the menu and are marked Unsorted." : "BILL is cash. CHARGE is the QR sale. ALL includes both.";
  var rows = items.filter(p => unitsOf(p) || moneyOf(p)).sort((a, b) => moneyOf(b) - moneyOf(a));
  document.getElementById("today-table-body").innerHTML = rows.length ? rows.map(function (p) {
    return "<tr><td>" + esc(p.name) + "</td><td>" + unitsOf(p) + "</td><td><span class='tag " + tag(p.category) + "'>" + esc(p.category) + "</span></td><td style='text-align:right;'>" + baht(moneyOf(p)) + "</td></tr>";
  }).join("") : "<tr><td colspan='4' style='text-align:center; color:#64748b; padding:16px;'>No sales in this view yet.</td></tr>";
}

function renderPerformance() {
  var groups = ["Food", "Soft drinks", "Alcohol", "Unsorted"];
  document.getElementById("performance-list").innerHTML = groups.map(function (g) {
    var rows = (adminData.items || []).filter(p => p.category === g && (unitsOf(p) || moneyOf(p))).sort((a, b) => unitsOf(b) - unitsOf(a));
    return "<div class='section-title'>" + g + "</div>" + (rows.map(function (p) {
      return "<div class='item-row'><div><b>" + esc(p.name) + "</b><div class='note'>" + p.cashUnits + " BILL · " + p.posUnits + " CHARGE</div></div><div style='text-align:right;'><b>" + unitsOf(p) + " units</b><div class='note'>" + baht(moneyOf(p)) + "</div></div></div>";
    }).join("") || "<div class='note'>None in this range.</div>");
  }).join("");
}

function renderAnalytics() {
  var hourly = adminData.hourly || {};
  drawChart("chart-food", hourly.food, "food");
  drawChart("chart-soft", hourly.soft, "soft");
  drawChart("chart-alc", hourly.alcohol, "alc");
  document.getElementById("peak-line").textContent = peakSentence();
  var ranked = (adminData.items || []).filter(p => unitsOf(p) > 0).map(function (p) {
    return { name: p.name, category: p.category, units: unitsOf(p), money: moneyOf(p) };
  });
  var byMoney = ranked.slice().sort((a, b) => b.money - a.money).slice(0, 5);
  var byUnits = ranked.slice().sort((a, b) => b.units - a.units).slice(0, 5);
  var quiet = ranked.slice().sort((a, b) => a.units - b.units)[0];
  document.getElementById("best-lists").innerHTML =
    listBlock("Top 5 by baht", byMoney, function (p) { return baht(p.money) + " · " + p.units + " units"; })
    + listBlock("Top 5 by quantity", byUnits, function (p) { return p.units + " units · " + baht(p.money); })
    + (quiet ? "<div class='note'>Quietest seller in this view: " + esc(quiet.name) + " (" + quiet.units + ").</div>" : "");
}
function listBlock(title, rows, detail) {
  return "<div class='section-title'>" + title + "</div>" + (rows.map(function (p) {
    return "<div class='item-row'><div><b>" + esc(p.name) + "</b><div class='note'>" + esc(p.category) + "</div></div><div>" + detail(p) + "</div></div>";
  }).join("") || "<div class='note'>No sales yet.</div>");
}
function drawChart(id, bucket, cls) {
  var arr = bucket ? (bucket[payMode] || bucket.all || []) : [];
  var max = Math.max.apply(null, arr.concat([1]));
  var html = "";
  for (var h = 7; h <= 23; h++) {
    var val = arr[h] || 0;
    html += "<div class='bar-row'><div class='bar-label'>" + (h < 10 ? "0" : "") + h + ":00</div><div class='bar-track'><div class='bar-fill " + cls + "' style='width:" + Math.round(val / max * 100) + "%'></div></div><div>" + val + "</div></div>";
  }
  document.getElementById(id).innerHTML = html;
}
function peakSentence() {
  function peak(bucket, label) {
    var arr = bucket ? (bucket[payMode] || bucket.all || []) : [];
    var best = 0, hour = -1;
    arr.forEach(function (v, h) { if (v > best) { best = v; hour = h; } });
    return best ? label + " peaks at " + (hour < 10 ? "0" : "") + hour + ":00 (" + best + " units)" : "";
  }
  var h = adminData.hourly || {};
  return [peak(h.food, "Food"), peak(h.soft, "Soft drinks"), peak(h.alcohol, "Alcohol")].filter(Boolean).join(". ") || "No hourly sales in this view yet.";
}

function changeMonth(d) { calDate.setMonth(calDate.getMonth() + d); renderCalendar(); }
function fmt(d) { return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear(); }
function renderCalendar() {
  var y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById("cal-month-title").textContent = ["January","February","March","April","May","June","July","August","September","October","November","December"][m] + " " + y;
  var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), html = "";
  for (var i = 0; i < first; i++) html += "<div class='cal-day empty'></div>";
  for (var d = 1; d <= days; d++) {
    var curr = new Date(y, m, d), cls = "cal-day";
    if (rangeStart && rangeEnd && curr >= rangeStart && curr <= rangeEnd) cls += " in-range";
    else if (rangeStart && !rangeEnd && curr.getTime() === rangeStart.getTime()) cls += " selected";
    html += "<div class='" + cls + "' onclick='selectDay(" + y + "," + m + "," + d + ")'>" + d + "</div>";
  }
  document.getElementById("cal-days-grid").innerHTML = html;
  document.getElementById("cal-selection-label").textContent = rangeStart && rangeEnd ? fmt(rangeStart) + " to " + fmt(rangeEnd) : rangeStart ? fmt(rangeStart) : "Click a day, or two days for a range.";
}
function selectDay(y, m, d) {
  var clicked = new Date(y, m, d);
  if (!rangeStart || rangeEnd) { rangeStart = clicked; rangeEnd = null; }
  else if (clicked < rangeStart) { rangeEnd = rangeStart; rangeStart = clicked; }
  else rangeEnd = clicked;
  renderCalendar();
}
function fetchCalendar() {
  if (!rangeStart) return;
  fetchAdminData("custom", fmt(rangeStart), fmt(rangeEnd || rangeStart));
}
function renderLookup() {
  var items = (lookupData && lookupData.items) || [];
  var total = items.reduce((s, p) => s + p.cashRevenue + p.posRevenue, 0);
  var label = lookupData.startDate + (lookupData.endDate && lookupData.endDate !== lookupData.startDate ? " to " + lookupData.endDate : "");
  document.getElementById("lookup-results").innerHTML = "<div class='section-title'>ALL sales " + esc(label) + ": " + baht(total) + "</div>" + (items.sort((a, b) => (b.cashUnits + b.posUnits) - (a.cashUnits + a.posUnits)).map(function (p) {
    return "<div class='item-row'><div><b>" + esc(p.name) + "</b><div class='note'>" + esc(p.category) + " · " + p.cashUnits + " BILL · " + p.posUnits + " CHARGE</div></div><div>" + (p.cashUnits + p.posUnits) + " · " + baht(p.cashRevenue + p.posRevenue) + "</div></div>";
  }).join("") || "<div class='note'>No sales in that range.</div>");
}

fetchAdminData("today");
renderCalendar();
setInterval(function () { if (activeTab !== "lookup") fetchAdminData(currentRange); }, 30000);
</script>
</body>
</html>
