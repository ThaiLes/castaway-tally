<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Castaway Menu POS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #fff; padding: 12px; max-width: 600px; margin: 0 auto; user-select: none; }
    
    .header { border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .status { font-size: 11px; padding: 4px 8px; border-radius: 12px; background: #065f46; color: #34d399; font-weight: bold; }
    
    /* MASTER TOGGLE NAVIGATION (FOOD vs BEVERAGES) */
    .master-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .master-btn { padding: 14px; border-radius: 10px; border: none; background: #1e293b; color: #94a3b8; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
    .master-btn.active-food { background: #f59e0b; color: #0f172a; }
    .master-btn.active-bev { background: #38bdf8; color: #0f172a; }

    /* DYNAMIC SUB-CATEGORY CHIPS */
    .subnav-container { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .subnav-container::-webkit-scrollbar { display: none; }
    .sub-chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; font-weight: bold; font-size: 11px; cursor: pointer; }
    .sub-chip.active { background: #06b6d4; color: #0f172a; border-color: #06b6d4; }

    /* MENU ITEMS LIST */
    .items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 80px; }
    .item-card { background: #1e293b; padding: 14px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; min-height: 85px; }
    .item-card:active { background: #334155; }
    .item-title { font-size: 13px; font-weight: bold; color: #f8fafc; }
    .item-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .item-price { font-size: 14px; font-weight: bold; color: #06b6d4; }
    
    /* ADD TALLY BUTTON */
    .tally-btn { background: #06b6d4; color: #0f172a; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .tally-btn:active { transform: scale(0.95); }
    
    /* BOTTOM SUMMARY BAR */
    .cart-summary { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 1px solid #334155; padding: 12px 16px; max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .cart-info { font-size: 12px; color: #94a3b8; }
    .cart-total { font-size: 18px; font-weight: bold; color: #34d399; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2 style="margin:0; font-size:18px;">Castaway Menu</h2>
      <span style="font-size:11px; color:#94a3b8;">POS</span>
    </div>
    <span id="status" class="status">Live</span>
  </div>

  <!-- 1. MASTER FOOD vs BEVERAGES TOGGLE -->
  <div class="master-nav">
    <button onclick="switchMasterTab('FOOD')" id="master-btn-food" class="master-btn active-food">FOOD 🍔</button>
    <button onclick="switchMasterTab('BEVERAGES')" id="master-btn-bev" class="master-btn">BEVERAGES 🍹</button>
  </div>

  <!-- 2. DYNAMIC SUB-CATEGORY FILTER CHIPS -->
  <div id="subnav-container" class="subnav-container"></div>

  <!-- 3. MENU ITEMS GRID -->
  <div id="items-grid" class="items-grid"></div>

  <!-- 4. BOTTOM DAILY TALLY SUMMARY -->
  <div class="cart-summary">
    <div class="cart-info">Logged Today: <strong id="today-count" style="color:#fff;">0</strong> items</div>
    <div id="today-revenue" class="cart-total">฿0</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwEOvMwt5iebuNuTs0iJNT57OK0Lp9mzDMRT3nREF_PsvSLrYM-1tDUPl8vV2nmsNRF/exec";

    // Master list of beverage categories
    const BEVERAGE_CATEGORIES = [
      'Cocktails', 'Coffee', 'Teas & Chocolate', 'Smoothies', 
      'Fruit & Soda', 'Lassi', 'Milkshakes', 'Chilled Soda', 
      'Beers & Cider', 'Spirits & Mixers'
    ];

    let menuItems = [];
    let currentMaster = 'FOOD';
    let currentSubFilter = 'ALL';

    function fetchPOSData() {
      const script = document.createElement('script');
      script.src = API_URL + "?action=getAdminData&callback=handlePOSData&t=" + Date.now();
      document.body.appendChild(script);
    }

    window.handlePOSData = function(data) {
      if (data.status === 'success') {
        menuItems = data.items || [];
        renderSubChips();
        renderItems();
        updateTallySummary(data.counts);
      }
    };

    function switchMasterTab(master) {
      currentMaster = master;
      currentSubFilter = 'ALL';

      const foodBtn = document.getElementById('master-btn-food');
      const bevBtn = document.getElementById('master-btn-bev');

      if (master === 'FOOD') {
        foodBtn.className = 'master-btn active-food';
        bevBtn.className = 'master-btn';
      } else {
        foodBtn.className = 'master-btn';
        bevBtn.className = 'master-btn active-bev';
      }

      renderSubChips();
      renderItems();
    }

    function setSubFilter(sub) {
      currentSubFilter = sub;
      renderSubChips();
      renderItems();
    }

    function renderSubChips() {
      const container = document.getElementById('subnav-container');
      let subCats = [];

      if (currentMaster === 'FOOD') {
        // Collect unique food categories from active items
        const foodCats = menuItems
          .filter(i => !BEVERAGE_CATEGORIES.includes(i.category))
          .map(i => i.category);
        subCats = ['ALL', ...new Set(foodCats)];
      } else {
        // Collect unique beverage categories from active items
        const bevCats = menuItems
          .filter(i => BEVERAGE_CATEGORIES.includes(i.category))
          .map(i => i.category);
        subCats = ['ALL', ...new Set(bevCats)];
      }

      container.innerHTML = subCats.map(cat => `
        <button onclick="setSubFilter('${cat}')" class="sub-chip ${currentSubFilter === cat ? 'active' : ''}">${cat}</button>
      `).join('');
    }

    function renderItems() {
      const grid = document.getElementById('items-grid');

      const filtered = menuItems.filter(item => {
        const isDrink = BEVERAGE_CATEGORIES.includes(item.category);

        // Master Filter
        if (currentMaster === 'FOOD' && isDrink) return false;
        if (currentMaster === 'BEVERAGES' && !isDrink) return false;

        // Sub-Category Filter
        if (currentSubFilter !== 'ALL' && item.category !== currentSubFilter) return false;

        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; color: #64748b; text-align: center; padding: 20px;">No items in this section.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="item-card">
          <div>
            <div class="item-title">${item.name}</div>
            <div class="item-sub">${item.category} (${item.id})</div>
          </div>
          <div class="item-footer">
            <div class="item-price">฿${item.price}</div>
            <button onclick="logTally('${item.id}', '${item.name.replace(/'/g, "\\'")}')" class="tally-btn">+1</button>
          </div>
        </div>
      `).join('');
    }

    function logTally(itemId, itemName) {
      document.getElementById('status').innerText = "Logging...";
      
      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          itemId: itemId,
          itemName: itemName,
          tally: 1
        })
      }).then(() => {
        document.getElementById('status').innerText = "Logged!";
        setTimeout(() => { document.getElementById('status').innerText = "Live"; }, 1500);
        fetchPOSData();
      });
    }

    function updateTallySummary(counts) {
      if (!counts) return;
      let totalUnits = 0;
      let totalRev = 0;

      menuItems.forEach(item => {
        const c = counts[item.id] || 0;
        if (c > 0) {
          totalUnits += c;
          totalRev += (c * item.price);
        }
      });

      document.getElementById('today-count').innerText = totalUnits;
      document.getElementById('today-revenue').innerText = `฿${totalRev.toLocaleString()}`;
    }

    fetchPOSData();
    setInterval(fetchPOSData, 15000);
  </script>
</body>
</html>
