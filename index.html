<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Castaway POS</title>
  
  <!-- Web App & iOS App Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="pos-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="pos-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Castaway POS">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castaway Menu Tally</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 16px; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 16px; }
    .status { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: #065f46; color: #34d399; font-weight: bold; }
    .status.syncing { background: #854d0e; color: #fde047; }
    .status.error { background: #991b1b; color: #f87171; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    button.cat-btn { padding: 12px; border-radius: 8px; border: none; background: #1e293b; color: #cbd5e1; font-weight: bold; cursor: pointer; text-align: center; }
    button.cat-btn.active { background: #06b6d4; color: #0f172a; }
    .item-card { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 16px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #334155; }
    .btn-tally { width: 38px; height: 38px; border-radius: 8px; border: none; font-size: 20px; font-weight: bold; cursor: pointer; }
    .btn-plus { background: #06b6d4; color: #0f172a; }
    .btn-minus { background: #334155; color: #cbd5e1; }
    .count { font-size: 18px; font-weight: bold; color: #06b6d4; min-width: 28px; text-align: center; display: inline-block; }
  </style>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h2 style="margin:0; font-size:18px;">Castaway Menu</h2>
        <span style="font-size:11px; color:#94a3b8;">POS</span>
      </div>
      <span id="status" class="status">Live</span>
    </div>
    
    <div id="category-list" class="grid"></div>
    <div id="item-list"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwEOvMwt5iebuNuTs0iJNT57OK0Lp9mzDMRT3nREF_PsvSLrYM-1tDUPl8vV2nmsNRF/exec";

    let menuItems = JSON.parse(localStorage.getItem('castaway_menu') || '[]');
    let categories = JSON.parse(localStorage.getItem('castaway_cats') || '[]');
    let counts = JSON.parse(localStorage.getItem('castaway_counts') || '{}');
    let selectedCategory = categories[0] || null;

    // Render immediately from local cache
    if (categories.length > 0) {
      renderCategories();
      renderItems();
    }

    function syncWithBackend() {
      const statusEl = document.getElementById('status');
      if (statusEl) {
        statusEl.innerText = "Syncing...";
        statusEl.className = "status syncing";
      }

      const script = document.createElement('script');
      script.src = API_URL + "?callback=handleDataResponse&t=" + Date.now();
      script.onerror = function() {
        if (statusEl) {
          statusEl.innerText = "Offline";
          statusEl.className = "status error";
        }
      };
      document.body.appendChild(script);
    }

    window.handleDataResponse = function(data) {
    const statusEl = document.getElementById('status');
    if (data.status === 'success') {
      menuItems = data.items || [];
      categories = data.categories || [];
      const incomingCounts = data.counts || {};
      
      // Check if midnight has passed since last load
      const todayStr = new Date().toLocaleDateString('en-GB'); // "25/08/2026"
      const lastSavedDate = localStorage.getItem('castaway_date');

      if (lastSavedDate !== todayStr) {
        // New day detected: Purge yesterday's cached counts
        counts = {};
        localStorage.setItem('castaway_date', todayStr);
      }

      menuItems.forEach(item => {
        const cleanId = item.id ? item.id.toString().trim() : "";
        const sheetVal = incomingCounts[cleanId] !== undefined ? incomingCounts[cleanId] : 0;
        const localVal = counts[cleanId] !== undefined ? counts[cleanId] : 0;
        
        // Merge sheet tallies for TODAY only
        counts[cleanId] = Math.max(sheetVal, localVal);
      });

    localStorage.setItem('castaway_menu', JSON.stringify(menuItems));
    localStorage.setItem('castaway_cats', JSON.stringify(categories));
    localStorage.setItem('castaway_counts', JSON.stringify(counts));

    if (!selectedCategory && categories.length > 0) selectedCategory = categories[0];

    if (statusEl) {
      statusEl.innerText = "Live";
      statusEl.className = "status";
    }
    renderCategories();
    renderItems();
  }
};

    function renderCategories() {
      const container = document.getElementById('category-list');
      container.innerHTML = categories.map(cat => `
        <button onclick="selectCat('${cat}')" class="cat-btn ${selectedCategory === cat ? 'active' : ''}">${cat}</button>
      `).join('');
    }

    function selectCat(cat) {
      selectedCategory = cat;
      renderCategories();
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById('item-list');
      const filtered = menuItems.filter(i => i.category === selectedCategory);

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px;">Select a category</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const cleanId = item.id ? item.id.toString().trim() : "";
        const currentVal = counts[cleanId] !== undefined ? counts[cleanId] : 0;

        return `
          <div class="item-card">
            <div>
              <div style="font-weight:bold; font-size:14px;">${item.name}</div>
              <div style="font-size:12px; color:#06b6d4; margin-top:2px;">฿${item.price}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <button onclick="logTally('${cleanId}', '${item.name.replace(/'/g, "\\'")}', -1)" class="btn-tally btn-minus">-</button>
              <span class="count">${currentVal}</span>
              <button onclick="logTally('${cleanId}', '${item.name.replace(/'/g, "\\'")}', 1)" class="btn-tally btn-plus">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function logTally(id, name, val) {
      const cleanId = id.toString().trim();

      if (val < 0) {
        counts[cleanId] = Math.max(0, (counts[cleanId] || 0) - 1);
      } else {
        counts[cleanId] = (counts[cleanId] || 0) + val;
      }

      localStorage.setItem('castaway_counts', JSON.stringify(counts));
      renderItems();

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId: cleanId, itemName: name, tally: val })
      });
    }

    syncWithBackend();
    setInterval(syncWithBackend, 10000);
  </script>
</body>
</html>
